<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>今晚偷月亮</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="wrap">
  <header><div class="eyebrow">A TINY NIGHT GAME</div><h1>今晚偷月亮</h1><p>帮小猫把掉下来的星星接住。三次失手，月亮就溜走了。</p></header>
  <section class="game-card">
    <div class="hud"><span>⭐ <b id="score">0</b></span><span>连击 <b id="combo">0</b></span><span>❤️ <b id="lives">3</b></span><button id="restart">重新开始</button></div>
    <div id="stage" class="stage" tabindex="0">
      <div class="moon"><i></i></div><div class="cloud c1"></div><div class="cloud c2"></div>
      <div id="cat" class="cat"><div class="ear l"></div><div class="ear r"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div><div class="body"></div><div class="tail"></div></div>
      <div id="message" class="message">按 ← → 移动小猫，接住星星！</div>
    </div>
    <div class="controls"><button data-key="ArrowLeft">←</button><button id="start">开始</button><button data-key="ArrowRight">→</button></div>
    <div class="tip">手机直接按左右键；电脑用键盘 ← →。星星越多，掉得越快。</div>
  </section>
  <footer>小猫今晚只负责偷月亮，其他事情明天再说。</footer>
</main><script src="game.js"></script></body></html>
