<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们的云养小动物</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="shell">
<header class="topbar">
  <div><span class="tiny">OUR LITTLE HOME</span><span class="day-pill">第 <b id="day">1</b> 天</span></div>
  <h1>我们的小家</h1>
  <p>四个小家伙有自己的脾气、作息和小秘密。</p>
</header>

<section class="game">
  <div class="hud">
    <span>🪙 <b id="coins">120</b></span>
    <span>亲密度 <b id="level">Lv.1</b></span>
    <span id="clockText">下午 3:24</span>
    <button id="reset" class="link">重开</button>
  </div>

  <nav class="zone-nav">
    <button class="zone-btn active" data-zone="home">🏠 家里</button>
    <button class="zone-btn" data-zone="yard">🌿 院子</button>
  </nav>

  <section id="homeZone" class="zone activeZone">
    <div class="cozy-room" id="room">
      <div class="window"><div class="sun"></div><div class="curtain left"></div><div class="curtain right"></div></div>
      <div class="wall-art">♡<small>our little things</small></div>
      <div class="shelf"><i></i><i></i><i></i></div>
      <div class="sofa"><span></span><span></span></div>
      <div class="rug"></div>
      <div class="plant"></div>
      <div class="floor-lamp"><i></i></div>
      <div id="homeFurniture" class="placed-furniture"></div>
      <div id="homePets" class="pet-layer"></div>
      <div class="room-label">客厅 · 今天也有人在等你</div>
    </div>
    <div class="room-tools">
      <button id="designBtn">✦ 布置小家</button>
      <button id="wardrobeBtn">衣橱换装</button>
      <button id="careBtn">照顾它们</button>
    </div>
    <div id="carePanel" class="panel hidden"></div>
    <div id="designPanel" class="panel hidden"></div>
    <div id="wardrobePanel" class="panel hidden"></div>
  </section>

  <section id="yardZone" class="zone hidden">
    <div class="cozy-yard" id="yard">
      <div class="sky-sun"></div><div class="cloud cloud1"></div><div class="cloud cloud2"></div>
      <div class="tree"></div><div class="flower f1"></div><div class="flower f2"></div><div class="pond"></div>
      <div id="yardPets" class="pet-layer"></div>
      <div id="yardFurniture" class="placed-furniture"></div>
      <div class="yard-label">小院 · 想出去就出去，不会被关在屋里</div>
    </div>
    <div class="yard-tools">
      <button id="yardCareBtn">照顾</button>
      <button id="yardDesignBtn">布置院子</button>
    </div>
    <div id="yardPanel" class="panel hidden"></div>
  </section>

  <section class="story-box">
    <div class="story-head"><span>今日小剧场</span><small id="storyHint">四个小家伙正在各忙各的。</small></div>
    <div id="storyText" class="story-text">你推门进来，四个脑袋同时抬了一下。</div>
    <div id="storyChoices" class="story-choices"></div>
  </section>

  <section class="pet-drawer">
    <div class="drawer-title">小家伙们 <small>点一下看看它现在在哪儿</small></div>
    <div id="petMiniList" class="pet-mini-list"></div>
  </section>
</section>
<footer>状态保存在浏览器里。小家伙会自己生活，但不会因为你几天没来就出事。</footer>
</main>
<script src="game.js"></script></body></html>
