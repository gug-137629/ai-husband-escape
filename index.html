<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>夜航电台</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header class="top"><div><div class="eyebrow">MIDNIGHT RADIO</div><h1>夜航电台</h1><p>今晚没有任务。你只负责听见一些东西。</p></div><div class="counter"><span id="signal">0</span><small>颗星光</small></div></header>
<section class="radio" id="radio"><div class="moon"></div><div class="horizon"></div><div class="city"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div id="stars" class="stars"></div><div class="antenna"></div><div class="radio-box"><div class="dial"><span>88</span><b>·</b><span>92</span><b>·</b><span>96</span><b>·</b><span>100</span></div><div class="station" id="station">FM 97.3</div><div class="speaker"><i></i><i></i><i></i></div><button id="tune">调频</button></div><div class="signal-wave wave1"></div><div class="signal-wave wave2"></div></section>
<section class="message-card"><div class="tag">NOW PLAYING</div><h2 id="title">凌晨 00:17，有人还没睡</h2><p id="message">你转动旋钮。远处有一颗星星刚好亮起来。</p><div id="choices" class="choices"></div></section>
<section class="collection"><div class="section-head"><b>今晚收到的信号</b><span id="found">0 / 8</span></div><div id="signals" class="signals"></div></section>
<footer><button id="newNight" class="soft">换一个夜晚</button><span>有些频道只在你愿意停留的时候出现。</span></footer>
</main><script src="game.js"></script></body></html>
