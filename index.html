<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云养小猫 🐈</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><section class="hero"><div class="eyebrow">A tiny cat that lives online</div><h1>云养小猫 🐈</h1><p>给它起个名字，然后每天来看看它。它会记住你上次来过。</p></section><section class="cat-card"><div class="topbar"><label>小猫名字 <input id="catName" maxlength="12" value="小笨猫"></label><button id="reset" class="ghost">重新养一只</button></div><div id="catRoom" class="cat-room"><div class="window">☁️<br><span>今日天气很好</span></div><div id="cat" class="cat">🐈</div><div id="thought" class="thought">……喵。</div><div class="floor">· · · · · · · · · · · ·</div></div><div class="stats"><div><span>🍗 饱腹</span><b id="hunger">80</b><i><em id="hungerBar"></em></i></div><div><span>💗 心情</span><b id="mood">80</b><i><em id="moodBar"></em></i></div><div><span>✨ 干净</span><b id="clean">80</b><i><em id="cleanBar"></em></i></div><div><span>⚡ 精力</span><b id="energy">80</b><i><em id="energyBar"></em></i></div></div><div class="actions"><button data-action="feed">🍗<strong>喂它</strong><small>恢复饱腹</small></button><button data-action="play">🧶<strong>陪玩</strong><small>提升心情</small></button><button data-action="pet">🫳<strong>摸摸</strong><small>它会记住</small></button><button data-action="clean">🛁<strong>洗香香</strong><small>恢复干净</small></button><button data-action="sleep">💤<strong>哄睡</strong><small>恢复精力</small></button></div><div id="log" class="log">今天是你第一次来看它。它抬头看了你一眼。</div></section><section class="note"><span>☁️</span><p>这是一个会保存状态的小角落：关掉页面再回来，小猫还在。状态保存在你的浏览器里。</p></section></main><script src="game.js"></script></body></html>
