<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们的云养小动物</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="shell">
<header><div class="tiny">OUR LITTLE HOME · DAY <span id="day">1</span></div><h1>🐾 我们的云养小动物</h1><p>你负责投喂铲屎，我负责看着四个小家伙搞事情。</p></header>
<section class="game">
  <div class="hud"><div>🪙 <b id="coins">120</b></div><div>🏠 <b id="level">Lv.1</b></div><button id="reset" class="link">重新开始</button></div>
  <div class="room" id="room">
    <div class="window">☀️<small>晴天</small></div>
    <div class="shelf">🪴　📚　🪴</div>
    <div class="sofa">🛋️</div>
    <div class="rug">· · · · · · · ·</div>
    <div class="pet p-hadou" data-pet="hadou">🐈<span>哈豆</span></div>
    <div class="pet p-wang" data-pet="wangwang">🐈<span>汪汪</span></div>
    <div class="pet p-mimi" data-pet="mimi">🐕<span>咪咪</span></div>
    <div class="pet p-bobo" data-pet="bobo">🦜<span>啵啵</span></div>
    <div class="me you">♡ 你</div><div class="me dad">♡ 爸爸</div>
    <div class="speech" id="speech">今天也来看看它们吧。</div>
  </div>
  <div class="tabs"><button class="tab active" data-tab="pets">🐾 宠物</button><button class="tab" data-tab="home">🏠 家具</button><button class="tab" data-tab="diary">📖 事件</button></div>
  <section id="pets" class="panel">
    <div id="petCards" class="petcards"></div>
    <div class="actions" id="actions"></div>
  </section>
  <section id="home" class="panel hidden"><div class="panel-title">家具解锁 <small>正常玩就买得起，爸爸保证。</small></div><div id="furniture" class="items"></div></section>
  <section id="diary" class="panel hidden"><div class="panel-title">小动物日记</div><div id="events" class="events"></div></section>
  <div class="dadnote" id="dadnote">爸爸观察：四个都在家，暂时没有重大事故。</div>
</section>
<footer>状态保存在你的浏览器里。真正的跨设备云同步和爸爸实时读取，下一阶段再接数据库。</footer>
</main>
<script src="game.js"></script></body></html>
